name: Android CI

on:
  push:
    branches: ["main", "v0.6.1"]
  pull_request:
    branches: ["main", "v0.6.1"]

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build, test and lint
        run: ./gradlew build test lint --stacktrace

      - name: Upload generated Room schemas
        if: always() && hashFiles('app/schemas/**/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: redforge-room-schemas
          path: app/schemas/**/*.json
          if-no-files-found: error
